name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request: # the gate must judge pull requests too
    branches: [main]
  workflow_dispatch: # so an auto-merged bump can dispatch its own deploy

permissions:
  contents: read

concurrency:
  # NOT a bare `pages`: with cancel-in-progress, a pull-request run would cancel
  # a live main deployment.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies exactly from the lockfile
        run: npm ci

      - name: Stamp the artifact with its exact source revision
        run: |
          mkdir -p public
          printf '{"source_sha":"%s","repository":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" > public/deployment.json

      - name: Unit tests (Vitest, incl. the Folly and RFC 7693 vectors)
        # The WHOLE suite, not the a11y half: a sweep of this fleet found 29
        # repos whose deploy job ran `test:a11y` alone, so their algorithmic
        # suites never blocked a publish.
        #
        # And the COUNT is asserted, not just the exit status: a test step that
        # runs zero tests exits 0, and the gate then passes having checked
        # nothing. The floor is deliberately below the current total so a test
        # being added does not fail CI, and far above zero so a glob that stops
        # matching does.
        run: |
          set -eu
          npx vitest run --reporter=json --outputFile=vitest-results.json
          node -e '
            const r = require("./vitest-results.json");
            const total = r.numTotalTests ?? 0;
            const passed = r.numPassedTests ?? 0;
            console.log(`vitest reported ${passed}/${total} tests`);
            if (total < 70) { console.log(`::error::expected at least 70 unit tests, saw ${total}`); process.exit(1); }
            if (passed !== total) { console.log(`::error::${total - passed} unit tests did not pass`); process.exit(1); }
          '

      - name: Build (typecheck gates the build)
        run: npm run build

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # The image carries the exact browser binaries and Linux libraries Playwright
  # expects, so the rendering environment cannot drift under an unchanged commit.
  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    env:
      # The Actions runner mounts a HOME the browsers cannot use in-container.
      HOME: /root
      # Keep in step with the image tag above; asserted before the gate runs.
      EXPECTED_PLAYWRIGHT_VERSION: 1.65.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies exactly from the lockfile
        run: npm ci

      # The image carries ONE set of browser builds and npm ci installs what the
      # lockfile resolves, so a caret range here is an instruction to drift apart
      # from the image. crypto-lab-cold-boot declared ^1.64.0 against v1.64.0-noble,
      # resolved 1.65.1, and every launch died with "Executable doesn't exist at
      # /ms-playwright/chromium_headless_shell-..." -- browser-gate red, deploy
      # skipped on needs:, nothing published, and no line naming the cause.
      - name: Fail if the installed Playwright does not match the image
        run: |
          set -eu
          installed=$(npx playwright --version | awk '{print $2}')
          echo "installed Playwright $installed; image carries browsers for $EXPECTED_PLAYWRIGHT_VERSION"
          [ "$installed" = "$EXPECTED_PLAYWRIGHT_VERSION" ] || {
            echo "::error::Playwright $installed does not match the container image ($EXPECTED_PLAYWRIGHT_VERSION); its browsers are not in this image. Bump the image tag and digest and EXPECTED_PLAYWRIGHT_VERSION together, or pin @playwright/test back."
            exit 1
          }
      - name: Accessibility gate (axe-core, WCAG A/AA), claims, verdicts, coverage
        # `playwright test` with no argument runs every project in
        # playwright.config.ts: the axe gate at two widths, the claims suite, the
        # verdict suite and the coverage scan. The global teardown additionally
        # fails the run if any recorded mutation kill never executed.
        run: npx playwright test

  deploy:
    needs: [build, browser-gate]
    # NOT `== 'push'`: that would also skip workflow_dispatch, which is the one
    # trigger the post-auto-merge deploy depends on.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify the served bytes are built from this revision
        env:
          LIVE_URL: https://systemslibrarian.github.io/crypto-lab-lthash/
        run: |
          set -eu
          for attempt in $(seq 1 18); do
            result=$(curl -fsSL --connect-timeout 8 --max-time 15 -H 'Cache-Control: no-cache' "${LIVE_URL}deployment.json?sha=${GITHUB_SHA}" 2>/dev/null || true)
            if node -e 'try { const p=JSON.parse(process.argv[1]);process.exit(p.source_sha===process.argv[2]&&p.repository===process.argv[3]?0:1) } catch { process.exit(1) }' "$result" "$GITHUB_SHA" "$GITHUB_REPOSITORY"; then
              html=$(curl -fsSL --connect-timeout 8 --max-time 15 -H 'Cache-Control: no-cache' "${LIVE_URL}?sha=${GITHUB_SHA}" 2>/dev/null || true)
              if printf '%s' "$html" | grep -Fq 'id="app"'; then
                echo "Verified live HTML and source revision $GITHUB_SHA at $LIVE_URL"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Live Pages failed source-SHA/HTML verification"
          exit 1

  # Dependabot only. The complete gate decides whether a bump is safe; this job
  # then merges and explicitly dispatches the main deployment.
  dependabot-auto-merge:
    needs: [build, browser-gate]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # actions: write is required for the deploy dispatch below. Without it
      # `gh workflow run` returns HTTP 403 "Resource not accessible by
      # integration", the merged bump never deploys, and a `|| echo` fallback
      # hides it.
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Merge any bump whose gate went green
        run: |
          set -eu
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; the base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::error::gate passed but the merge did not land after 3 attempts; the bump is unmerged and no deploy was dispatched"
            exit 1
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          #
          # Dispatch the file THIS lab has: most are deploy.yml, some deploy-pages.yml
          # or pages.yml. A copied name 404s only on the auto-merge path, after the
          # merge has landed.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
